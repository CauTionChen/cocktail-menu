<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Private Cocktail Menu</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f8f4ee;
    font-family: 'Georgia', 'Noto Serif CJK SC', serif;
    color: #3d2e1a;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .page-header {
    padding: 56px 56px 40px;
    border-bottom: 1px solid #ddd2c2;
  }
  .page-header h1 {
    font-size: 10px;
    letter-spacing: 12px;
    color: #a89880;
    font-weight: 400;
    text-transform: uppercase;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }
  .cards { max-width: 720px; margin: 0 auto; padding: 0 56px 80px; }
  .c-card {
    position: relative;
    margin-top: 64px;
    padding-bottom: 56px;
    border-bottom: 1px solid #ddd2c2;
  }
  .c-card:last-child { border-bottom: none; }
  .c-num {
    position: absolute;
    top: -4px; right: 0;
    font-size: 72px;
    font-weight: 700;
    color: #ece8e0;
    line-height: 1;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    letter-spacing: -4px;
    user-select: none;
  }
  /* 图片：无边框无阴影，自然融入背景 */
  .c-img-wrap {
    width: 100%;
    height: auto;
    overflow: hidden;
    margin-bottom: 24px;
    background: #f0ebe2;
  }
  .c-img {
    width: 100%;
    height: auto;
    display: block;
    filter: sepia(0.03) saturate(0.95) brightness(1.02);
    transition: filter 0.5s ease;
  }
  .c-card:hover .c-img {
    filter: sepia(0.02) saturate(0.97) brightness(1.03);
  }
  .c-img-placeholder {
    width: 100%; min-height: 240px;
    display: flex; align-items: center; justify-content: center;
    font-size: 48px;
    background: #ece8e0;
  }
  .c-info { padding-left: 0; }
  .c-name {
    font-size: 24px;
    font-weight: 400;
    letter-spacing: 4px;
    color: #3d2e1a;
    margin-bottom: 12px;
    line-height: 1.3;
    display: flex;
    align-items: baseline;
    gap: 14px;
    flex-wrap: wrap;
    font-family: 'Noto Serif CJK SC', 'Georgia', serif;
  }
  .c-name-en {
    font-size: 12px;
    font-weight: 300;
    letter-spacing: 4px;
    color: #a89880;
    font-family: 'Georgia', serif;
    font-style: italic;
    text-transform: uppercase;
  }
  .c-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; align-items: center; }
  .c-tag {
    font-size: 9px;
    letter-spacing: 3px;
    color: #8a7a64;
    border: 1px solid #c8bca8;
    padding: 2px 8px;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    text-transform: uppercase;
  }
  .c-spirit { color: #9a8a70; border-color: #b8aa90; }
  .c-abv { font-size: 10px; letter-spacing: 2px; color: #b8a078; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  .c-garnish { font-size: 11px; color: #9a8a78; letter-spacing: 1px; margin-bottom: 8px; font-style: italic; font-family: 'Georgia', serif; }
  .c-note {
    font-size: 16px;
    color: #5a4830;
    line-height: 1.9;
    font-style: italic;
    font-family: 'Noto Serif CJK SC', 'Georgia', serif;
    margin-bottom: 10px;
  }
  .c-origin {
    font-size: 10px;
    color: #a09888;
    letter-spacing: 0.5px;
    line-height: 2;
    margin-bottom: 14px;
    font-style: italic;
    font-family: 'Georgia', serif;
    padding-left: 12px;
    border-left: 1px solid #ddd2c2;
  }
  .c-recipe {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
    padding-top: 12px;
    border-top: 1px solid #ede8de;
  }
  .c-recipe-label {
    font-size: 8px;
    letter-spacing: 4px;
    color: #c0b4a4;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    text-transform: uppercase;
    flex-shrink: 0;
  }
  .c-recipe-text {
    font-size: 11px;
    color: #8a7a68;
    letter-spacing: 1px;
    font-family: 'Georgia', serif;
  }
  .footer {
    text-align: center;
    padding: 40px 0 56px;
    font-size: 9px;
    letter-spacing: 6px;
    color: #c0b4a4;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    text-transform: uppercase;
  }
  @media (max-width: 600px) { .cards { padding: 0 24px 60px; } .page-header { padding: 44px 24px 32px; } .c-name { font-size: 19px; gap: 10px; } .c-name-en { font-size: 11px; } .c-num { font-size: 56px; } .c-note { font-size: 14px; } }
</style>
</head>
